name: Build patched runner

on:
  push:
    branches: [feature/self-hosted-artifact-results-url]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runtime: [osx-x64, osx-arm64]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build runner layout
        run: ./dev.sh layout Release ${{ matrix.runtime }}
        working-directory: src
      - name: Package runner
        run: ./dev.sh package Release ${{ matrix.runtime }}
        working-directory: src
      - name: Publish patched runner package
        uses: actions/upload-artifact@v7
        with:
          name: patched-runner-${{ matrix.runtime }}
          path: _package/*
          if-no-files-found: error
          retention-days: 3
