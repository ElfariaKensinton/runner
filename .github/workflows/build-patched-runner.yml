name: Build patched runner

on:
  push:
    branches: [feature/self-hosted-artifact-results-url]
  workflow_dispatch:
    inputs:
      push_to_release:
        description: 'Upload the built runner packages to a GitHub Release'
        type: boolean
        required: true
        default: false

permissions:
  actions: read
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runtime: [osx-x64, osx-arm64]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build runner layout
        run: ./dev.sh layout Release ${{ matrix.runtime }}
        working-directory: src
      - name: Package runner
        run: ./dev.sh package Release ${{ matrix.runtime }}
        working-directory: src
      - name: Publish patched runner package
        uses: actions/upload-artifact@v7
        with:
          name: patched-runner-${{ matrix.runtime }}
          path: _package/*
          if-no-files-found: error
          retention-days: 3

  artifact-summary:
    name: Artifact summary
    if: always() && needs.build.result == 'success'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Render GitHub-style artifact list
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              per_page: 100
            });

            const visible = artifacts.filter(a => !a.expired);
            const lines = [
              '## Artifacts',
              '',
              'Produced during runtime',
              '',
              '| **Name** | **Size** | **Digest** |   |',
              '| :--- | :--- | :--- | - |'
            ];

            const formatSize = bytes => {
              if (bytes >= 1024 * 1024) return `${Math.round(bytes / (1024 * 1024))} MB`;
              if (bytes >= 1024) return `${Math.round(bytes / 1024)} KB`;
              return `${bytes} B`;
            };

            for (const artifact of visible) {
              const url = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}/artifacts/${artifact.id}`;
              const name = artifact.name.replace(/\\/g, '\\\\').replace(/\|/g, '\\|').replace(/\[/g, '\\[').replace(/\]/g, '\\]');
              const digest = artifact.digest || '—';
              lines.push(`| [**${name}**](${url}) | ${formatSize(artifact.size_in_bytes)} | \`${digest}\` |   |`);
            }

            if (visible.length === 0) {
              lines.push('| No artifacts found | — | — |   |');
            }

            await core.summary.addRaw(lines.join('\n')).write();

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.push_to_release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download macOS x64 package
        uses: actions/download-artifact@v8
        with:
          name: patched-runner-osx-x64
          path: release-assets/osx-x64

      - name: Download macOS ARM64 package
        uses: actions/download-artifact@v8
        with:
          name: patched-runner-osx-arm64
          path: release-assets/osx-arm64

      - name: Prepare GitHub Release
        id: release
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const version = fs.readFileSync('${{ github.workspace }}/src/runnerversion', 'utf8').trim();
            const tag = 'v' + version;
            const assetNames = [
              `actions-runner-osx-x64-${version}.tar.gz`,
              `actions-runner-osx-arm64-${version}.tar.gz`
            ];

            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag
              })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: tag,
                body: `Patched GitHub Actions runner packages for ${version}.`,
                draft: false,
                prerelease: false
              })).data;
            }

            // Replace only the two patched macOS assets if they already exist.
            for (const asset of (release.assets || [])) {
              if (assetNames.includes(asset.name)) {
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: asset.id
                });
              }
            }

            core.setOutput('version', version);
            core.setOutput('upload_url', release.upload_url);

      - name: Upload Release Asset (osx-x64)
        uses: actions/upload-release-asset@v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.release.outputs.upload_url }}
          asset_path: ${{ github.workspace }}/release-assets/osx-x64/actions-runner-osx-x64-${{ steps.release.outputs.version }}.tar.gz
          asset_name: actions-runner-osx-x64-${{ steps.release.outputs.version }}.tar.gz
          asset_content_type: application/gzip

      - name: Upload Release Asset (osx-arm64)
        uses: actions/upload-release-asset@v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.release.outputs.upload_url }}
          asset_path: ${{ github.workspace }}/release-assets/osx-arm64/actions-runner-osx-arm64-${{ steps.release.outputs.version }}.tar.gz
          asset_name: actions-runner-osx-arm64-${{ steps.release.outputs.version }}.tar.gz
          asset_content_type: application/gzip
