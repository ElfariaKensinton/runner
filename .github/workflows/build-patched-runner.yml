name: Build patched runner

on:
  push:
    branches: [feature/self-hosted-artifact-results-url]
  workflow_dispatch:
    inputs:
      runner_type:
        description: 'Runner for the build jobs (self-hosted requires a macOS runner labeled self-hosted and macOS)'
        type: choice
        required: true
        default: github-hosted
        options:
          - github-hosted
          - self-hosted
      push_to_release:
        description: 'Upload built packages to GitHub Release (branch pushes publish automatically)'
        type: boolean
        required: true
        default: false

permissions:
  actions: read
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runtime: [osx-arm64]
    runs-on: ${{ inputs.runner_type == 'self-hosted' && fromJSON('["self-hosted", "macOS"]') || 'macos-latest' }}
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Build runner layout
        run: ./dev.sh layout Release ${{ matrix.runtime }}
        working-directory: src

      - name: Package runner
        run: ./dev.sh package Release ${{ matrix.runtime }}
        working-directory: src

      # Do not use download-artifact here: these packages may be stored by a
      # self-hosted artifact server and therefore are not in GitHub's artifact API.
      # Upload the file directly from this build job to the GitHub Release.
      - name: Publish patched package to GitHub Release
        if: github.event_name != 'workflow_dispatch' || inputs.push_to_release
        uses: actions/github-script@v9
        env:
          RUNNER_RUNTIME: ${{ matrix.runtime }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            const version = fs.readFileSync(
              path.join(process.env.GITHUB_WORKSPACE, 'src', 'runnerversion'),
              'utf8'
            ).trim();
            const runtime = process.env.RUNNER_RUNTIME;
            const tag = 'v' + version;
            const assetName = `actions-runner-${runtime}-${version}.tar.gz`;
            const assetPath = path.join(process.env.GITHUB_WORKSPACE, '_package', assetName);

            if (!fs.existsSync(assetPath)) {
              throw new Error(`Built package not found: ${assetPath}`);
            }

            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag
              })).data;
            } catch (error) {
              if (error.status !== 404) throw error;

              try {
                release = (await github.rest.repos.createRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag_name: tag,
                  name: tag,
                  body: `Patched GitHub Actions runner packages for ${version}.`,
                  draft: false,
                  prerelease: false
                })).data;
              } catch (createError) {
                // The other matrix job may have created the same release first.
                if (createError.status !== 422) throw createError;
                release = (await github.rest.repos.getReleaseByTag({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag
                })).data;
              }
            }

            // Replace this architecture's asset if it already exists.
            for (const asset of release.assets || []) {
              if (asset.name === assetName) {
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: asset.id
                });
              }
            }

            const stat = fs.statSync(assetPath);
            const uploaded = await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              name: assetName,
              data: fs.createReadStream(assetPath),
              headers: {
                'content-type': 'application/gzip',
                'content-length': stat.size
              }
            });

            core.info(`Published ${assetName}: ${uploaded.data.browser_download_url}`);

            // HomeRun's default preference downloads a stable v1 alias. Keep it
            // pointed at the same freshly built patched macOS arm64 runner package.
            const aliasRelease = (await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: 'v1'
            })).data;
            const aliasAssetName = 'actions-runner.tar.gz';

            for (const asset of aliasRelease.assets || []) {
              if (asset.name === aliasAssetName) {
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: asset.id
                });
              }
            }

            const aliasUploaded = await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: aliasRelease.id,
              name: aliasAssetName,
              data: fs.createReadStream(assetPath),
              headers: {
                'content-type': 'application/gzip',
                'content-length': stat.size
              }
            });

            core.info(`Updated HomeRun's stable runner URL: ${aliasUploaded.data.browser_download_url}`);

      # Upload to the configured Actions artifact service for short-term downloads.
      - name: Publish patched runner package
        uses: actions/upload-artifact@v7
        with:
          name: patched-runner-${{ matrix.runtime }}
          path: _package/*
          if-no-files-found: error
          retention-days: 3
